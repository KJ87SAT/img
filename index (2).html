<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習成果報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div id="stars"></div>
  <svg class="orbits" viewBox="0 0 1600 900" preserveAspectRatio="none">
    <path d="M -50 250 Q 400 50, 850 180 T 1650 120" stroke="#8fe9ff" stroke-width="1" fill="none" stroke-dasharray="2 6"/>
    <path d="M -80 700 Q 500 900, 1000 780 T 1700 830" stroke="#8fe9ff" stroke-width="1" fill="none" stroke-dasharray="2 6" opacity="0.6"/>
  </svg>

  <div class="panel">
    <div class="title-row">
      <h1 class="title">学習成果報告</h1>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-view="viewForm">記入</button>
      <button class="mode-tab" data-view="viewRecords">記録一覧</button>
      <button class="mode-tab" data-view="viewStats">統計</button>
    </div>

    <div class="scroll-area">

      <!-- ===== 記入ビュー ===== -->
      <div class="view active" id="viewForm">
        <div class="table">
          <div class="row">
            <div class="label">学習期間</div>
            <div class="divider"></div>
            <div class="content" id="fieldPeriod" contenteditable data-placeholder="学習期間を入力"></div>
          </div>
          <div class="row">
            <div class="label">学習内容</div>
            <div class="divider"></div>
            <div class="content" id="fieldContent" contenteditable data-placeholder="何を勉強したか"></div>
          </div>
          <div class="row">
            <div class="label">目的</div>
            <div class="divider"></div>
            <div class="content" id="fieldPurpose" contenteditable data-placeholder="何のために取り組んだか"></div>
          </div>
          <div class="row">
            <div class="label">学習環境</div>
            <div class="divider"></div>
            <div class="content" id="fieldEnvironment" contenteditable data-placeholder="場所・使った教材・集中度など"></div>
          </div>
          <div class="row">
            <div class="label">実施要領</div>
            <div class="divider"></div>
            <div class="content" id="fieldMethod" contenteditable data-placeholder="やり方・時間配分・次回への課題"></div>
          </div>
          <div class="row minutes-row">
            <div class="label">学習時間</div>
            <div class="divider"></div>
            <div class="content">
              <input type="number" min="0" class="minutes-input" id="fieldMinutes" placeholder="0">
              <span class="minutes-unit">分</span>
            </div>
          </div>
          <div class="row">
            <div class="label">タグ</div>
            <div class="divider"></div>
            <div class="content">
              <input type="text" class="tag-input" id="fieldTags" placeholder="例：数学, 英単語, 資格勉強">
            </div>
          </div>
        </div>
      </div>

      <!-- ===== 記録一覧ビュー ===== -->
      <div class="view" id="viewRecords">
        <div class="records-toolbar">
          <input type="text" class="search-input" id="searchInput" placeholder="記録を検索...">
          <button class="export-btn" id="exportBtn">書き出し</button>
        </div>
        <div id="recordsList"></div>
      </div>

      <!-- ===== 統計ビュー ===== -->
      <div class="view" id="viewStats">
        <div class="stats-summary">
          <div class="stat-box">
            <div class="s-label">今週の学習時間</div>
            <div class="s-value" id="statWeek">0分</div>
          </div>
          <div class="stat-box">
            <div class="s-label">連続記録</div>
            <div class="s-value" id="statStreak">0日</div>
          </div>
          <div class="stat-box">
            <div class="s-label">総学習時間</div>
            <div class="s-value" id="statTotal">0分</div>
          </div>
        </div>

        <div class="chart-wrap">
          <canvas id="chart"></canvas>
        </div>

        <div class="goal-box">
          <label for="goalInput">週間目標(分)</label>
          <input type="number" min="0" class="goal-input" id="goalInput" placeholder="例: 300">
          <div class="goal-bar-outer"><div class="goal-bar-inner" id="goalBar"></div></div>
          <span id="goalPct">未設定</span>
        </div>
      </div>

    </div>

    <div class="toolbar">
      <button class="tool-btn" id="dashboardBtn">＋&nbsp;&#9776; ダッシュボード</button>

      <div class="dashboard-panel" id="dashboardPanel">
        <h3>ダッシュボード</h3>
        <div class="dashboard-grid" id="dashboardGrid">
          <div class="widget-slot filled">
            <span class="w-icon">📊</span>
            <span class="w-value" id="widgetTotalTime">0分</span>
            今週の学習
          </div>
          <div class="widget-slot filled">
            <span class="w-icon">🔥</span>
            <span class="w-value" id="widgetStreak">0日</span>
            連続記録
          </div>
          <div class="widget-slot add-slot" id="addWidgetBtn">＋</div>
        </div>
      </div>

      <div class="right-controls">
        <div class="mode-select" id="modeSelect">
          Mode <span>⌄</span>
          <div class="mode-menu" id="modeMenu">
            <div>標準</div>
            <div>詳細</div>
            <div>簡潔</div>
          </div>
        </div>
        <button class="icon-btn" id="micBtn" title="音声入力">&#127908;</button>
        <button class="icon-btn submit-btn" id="submitBtn" title="記録する (Ctrl+Enter)">&#8593;</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
<script>
  // Mode dropdown（表示密度の切替。装飾的な項目名を保持しつつ簡易的に反映）
  const modeSelect = document.getElementById('modeSelect');
  const modeMenu = document.getElementById('modeMenu');
  modeSelect.addEventListener('click', (e) => {
    modeMenu.classList.toggle('open');
    e.stopPropagation();
  });
  modeMenu.querySelectorAll('div').forEach(item => {
    item.addEventListener('click', (e) => {
      modeSelect.firstChild.textContent = item.textContent + ' ';
      e.stopPropagation();
      modeMenu.classList.remove('open');
    });
  });
  document.addEventListener('click', () => modeMenu.classList.remove('open'));
</script>
</body>
</html>
